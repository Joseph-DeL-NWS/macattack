<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* Dark theme to match your dashboard */
    body { 
      background-color: #0b1320; 
      color: #e0e6ed; 
      font-family: 'Avenir Next', 'Segoe UI', sans-serif; 
      margin: 0; 
      padding: 10px; 
    }
    
    /* Compact Table Styling */
    table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
    }
    
    th { 
      background-color: #1a2b4c; 
      position: sticky; 
      top: 0; 
      padding: 8px; 
      border-bottom: 2px solid #2a4374; 
      text-align: left; 
      color: #ffffff;
    }
    
    td { 
      padding: 8px; 
      border-bottom: 1px solid #1a2b4c; 
    }
    
    /* Conditional MBA Wind Styling */
    .wind-advisory { 
      background-color: #ffcc00; 
      color: #000; 
      font-weight: bold; 
      border-radius: 4px; 
      padding: 3px 6px; 
    }
    
    .wind-escort { 
      background-color: #ff6600; 
      color: #fff; 
      font-weight: bold; 
      border-radius: 4px; 
      padding: 3px 6px; 
    }
    
    .wind-closure { 
      background-color: #cc0000; 
      color: #fff; 
      font-weight: bold; 
      border-radius: 4px; 
      padding: 3px 6px; 
    }
    
    #loading { 
      font-style: italic; 
      color: #8b949e; 
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="loading">Fetching live NWS data for Mackinac Bridge...</div>
  
  <table id="weatherTable" style="display:none;">
    <thead>
      <tr>
        <th>Time</th>
        <th>Temp</th>
        <th>Wind Speed</th>
        <th>Forecast</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    // Pre-calculated NWS Gridpoint for the Mackinac Bridge Midpoint (APX 74,67)
    const apiUrl = "https://api.weather.gov/gridpoints/APX/74,67/forecast/hourly";

    async function fetchWeather() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("Network response was not ok");
        
        const data = await response.json();
        
        // Grab the next 24 hours of forecast data
        const periods = data.properties.periods.slice(0, 36); 
        const tableBody = document.getElementById('tableBody');
        
        periods.forEach(period => {
          const row = document.createElement('tr');
          
          // 1. Extract the specific number from the string (turns "20 mph" into 20)
          const baseSpeed = parseInt(period.windSpeed) || 0;
          
          // 2. Extract the gust number if the NWS is forecasting one
          let gustSpeed = 0;
          let gustText = "";
          if (period.windGust) {
            gustSpeed = parseInt(period.windGust) || 0;
            // Only add the extra text if the gust is actually present
            if (gustSpeed > 0) {
              gustText = `<br><small><i>Gusts: ${period.windGust}</i></small>`;
            }
          }
          
          // 3. Find the highest threat (sustained vs gust) for the MBA colors
          const absoluteMaxWind = Math.max(baseSpeed, gustSpeed);
          
          // 4. Apply color rules based on Mackinac Bridge thresholds
          let windClass = "";
          if (absoluteMaxWind >= 50) {
            windClass = "wind-closure"; // Partial Closure
          } else if (absoluteMaxWind >= 35) {
            windClass = "wind-escort";  // Escorts Required
          } else if (absoluteMaxWind >= 20) {
            windClass = "wind-advisory"; // High Wind Advisory
          }
          
          // 5. Force Eastern Time for the Straits
          const date = new Date(period.startTime);
          const timeString = date.toLocaleTimeString('en-US', {
            hour: 'numeric', 
            weekday: 'short', 
            timeZone: 'America/Detroit'
          });

          // 6. Build the HTML row
          row.innerHTML = `
            <td><strong>${timeString}</strong></td>
            <td>${period.temperature}&deg;${period.temperatureUnit}</td>
            <td><span class="${windClass}">${period.windSpeed} ${period.windDirection} ${gustText}</span></td>
            <td>${period.shortForecast}</td>
          `;
          tableBody.appendChild(row);
        });
        
        // Hide loading text and show the table
        document.getElementById('loading').style.display = 'none';
        document.getElementById('weatherTable').style.display = 'table';
        
      } catch (error) {
        document.getElementById('loading').innerText = "Forecast temporarily unavailable.";
        console.error("NWS Fetch Error:", error);
      }
    }
    
    // Execute the function
    fetchWeather();
  </script>
</body>
</html>
