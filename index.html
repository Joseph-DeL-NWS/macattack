<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* Dark theme to match your dashboard */
    body { 
      background-color: #0b1320; 
      color: #e0e6ed; 
      font-family: 'Avenir Next', 'Segoe UI', sans-serif; 
      margin: 0; 
      padding: 10px; 
    }
    
    /* Compact Table Styling */
    table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
    }
    
    th { 
      background-color: #1a2b4c; 
      position: sticky; 
      top: 0; 
      padding: 8px; 
      border-bottom: 2px solid #2a4374; 
      text-align: left; 
      color: #ffffff;
    }
    
    td { 
      padding: 8px; 
      border-bottom: 1px solid #1a2b4c; 
    }
    
    /* Official MBA Wind Threshold Styling */
    .wind-normal {
      background-color: #2ea043;
      color: #fff;
      font-weight: bold;
      border-radius: 4px;
      padding: 3px 6px;
    }
    .wind-advisory { 
      background-color: #ffcc00; 
      color: #000; 
      font-weight: bold; 
      border-radius: 4px; 
      padding: 3px 6px; 
    }
    .wind-escort { 
      background-color: #ff6600; 
      color: #fff; 
      font-weight: bold; 
      border-radius: 4px; 
      padding: 3px 6px; 
    }
    .wind-closure { 
      background-color: #cc0000; 
      color: #fff; 
      font-weight: bold; 
      border-radius: 4px; 
      padding: 3px 6px; 
    }
    .wind-full-closure { 
      background-color: #8b0000; 
      color: #fff; 
      font-weight: bold; 
      border-radius: 4px; 
      padding: 3px 6px; 
      animation: blinker 1.5s linear infinite;
    }
    
    @keyframes blinker {
      50% { opacity: 0.5; }
    }

    #loading { 
      font-style: italic; 
      color: #8b949e; 
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="loading">Fetching live high-precision NWS grid data for Mackinac Bridge...</div>
  
  <table id="weatherTable" style="display:none;">
    <thead>
      <tr>
        <th>Time</th>
        <th>Temp</th>
        <th>Wind Speed (Mid-Span)</th>
        <th>Risk Level</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    // Exact Coordinates for Mackinac Bridge Mid-Span
    const LAT = 45.816;
    const LON = -84.727; 
    const pointsUrl = `https://api.weather.gov/points/${LAT},${LON}`;

    // Helper Function to parse NWS ISO 8601 time intervals
    function getValueAtTime(valuesArray, targetDate) {
      if (!valuesArray || valuesArray.length === 0) return null;
      for (let i = 0; i < valuesArray.length; i++) {
        const parts = valuesArray[i].validTime.split("/");
        const startTime = new Date(parts[0]);
        let hours = 1;
        
        // Extract the duration string from NWS format (e.g. PT1H or P1D)
        const match = parts[1].match(/PT(\d+)H/);
        const dayMatch = parts[1].match(/P(\d+)D/);
        
        if (match) hours = parseInt(match[1]);
        else if (dayMatch) hours = parseInt(dayMatch[1]) * 24;

        const endTime = new Date(startTime.getTime() + (hours * 60 * 60 * 1000));
        if (targetDate >= startTime && targetDate < endTime) return valuesArray[i].value;
      }
      return valuesArray[0].value; 
    }

    async function fetchWeather() {
      try {
        // 1. Fetch grid endpoint from exact coordinates
        const pointsRes = await fetch(pointsUrl);
        if (!pointsRes.ok) throw new Error("Could not reach NWS points API");
        const pointsData = await pointsRes.json();
        const gridUrl = pointsData.properties.forecastGridData;

        // 2. Fetch the raw meteorological grid data
        const gridRes = await fetch(gridUrl);
        if (!gridRes.ok) throw new Error("Could not reach NWS grid API");
        const gridData = await gridRes.json();

        const tempRaw = gridData.properties.temperature.values;
        const windRaw = gridData.properties.windSpeed.values;
        const gustRaw = gridData.properties.windGust.values;

        const tableBody = document.getElementById('tableBody');
        
        // 3. Setup current time, rounded to the top of the hour
        let now = new Date();
        now.setMinutes(0, 0, 0);

        // 4. Loop for the next 36 hours, jumping by 3 hours at a time to save vertical space
        for (let i = 0; i < 36; i += 3) {
          const targetTime = new Date(now.getTime() + (i * 60 * 60 * 1000));
          
          // Get values and convert units (C to F, and KPH to MPH)
          const tempC = getValueAtTime(tempRaw, targetTime);
          const windKph = getValueAtTime(windRaw, targetTime);
          const gustKph = getValueAtTime(gustRaw, targetTime);

          const tempF = Math.round((tempC * 9/5) + 32);
          const windMph = Math.round(windKph * 0.621371);
          const gustMph = gustKph !== null ? Math.round(gustKph * 0.621371) : 0;

          // 5. Apply Official Mackinac Bridge Authority Operational Thresholds
          // Based on direct MBA feedback: Restrictions use the highest threat (sustained OR gust)
          let status = "NORMAL";
          let windClass = "wind-normal";
          
          let maxWindThreat = Math.max(windMph, gustMph);
          
          if (maxWindThreat >= 65) {
            status = "FULL CLOSURE";
            windClass = "wind-full-closure";
          } else if (maxWindThreat >= 50) {
            status = "PARTIAL CLOSURE";
            windClass = "wind-closure";
          } else if (maxWindThreat >= 35) {
            status = "ESCORTS REQ.";
            windClass = "wind-escort";
          } else if (maxWindThreat >= 20) {
            status = "WIND ADVISORY";
            windClass = "wind-advisory";
          }

          // Format gusts for display
          let gustText = gustMph > 0 ? `<br><small><i>Gusts: ${gustMph} mph</i></small>` : "";
          
          // Format Time for Eastern standard (Bridge timezone)
          const timeString = targetTime.toLocaleTimeString('en-US', {
            hour: 'numeric', weekday: 'short', timeZone: 'America/Detroit'
          });

          // 6. Build the Row
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${timeString}</strong></td>
            <td>${tempF}&deg;F</td>
            <td><span class="${windClass}">${windMph} mph</span> ${gustText}</td>
            <td><strong><span class="${windClass}">${status}</span></strong></td>
          `;
          tableBody.appendChild(row);
        }

        // 7. Hide loader and display table
        document.getElementById('loading').style.display = 'none';
        document.getElementById('weatherTable').style.display = 'table';
        
      } catch (error) {
        document.getElementById('loading').innerText = "Forecast temporarily unavailable.";
        console.error("NWS Fetch Error:", error);
      }
    }

    // Execute
    fetchWeather();
  </script>
</body>
</html>
