<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      background-color: #0b1320; 
      color: #e0e6ed; 
      font-family: 'Avenir Next', 'Segoe UI', sans-serif; 
      margin: 0; 
      padding: 10px; 
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
    }
    th { 
      background-color: #1a2b4c; 
      position: sticky; 
      top: 0; 
      padding: 8px; 
      border-bottom: 2px solid #2a4374; 
      text-align: left; 
      color: #ffffff;
      z-index: 10;
    }
    td { 
      padding: 8px; 
      border-bottom: 1px solid #1a2b4c; 
    }
    
    /* MBA Operational Threshold Styling */
    .wind-normal { background-color: #2ea043; color: #fff; font-weight: bold; border-radius: 4px; padding: 3px 6px; }
    .wind-advisory { background-color: #ffcc00; color: #000; font-weight: bold; border-radius: 4px; padding: 3px 6px; }
    .wind-escort { background-color: #ff6600; color: #fff; font-weight: bold; border-radius: 4px; padding: 3px 6px; }
    .wind-closure { background-color: #cc0000; color: #fff; font-weight: bold; border-radius: 4px; padding: 3px 6px; }
    .wind-full-closure { background-color: #8b0000; color: #fff; font-weight: bold; border-radius: 4px; padding: 3px 6px; animation: blinker 1.5s linear infinite; }
    @keyframes blinker { 50% { opacity: 0.5; } }
    
    #loading { font-style: italic; color: #8b949e; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="loading">Fetching live high-precision NWS grid data...</div>
  <table id="weatherTable" style="display:none;">
    <thead>
      <tr>
        <th>Time</th>
        <th>Temp</th>
        <th>Clouds</th>
        <th>Wind Speed (Mid-Span)</th>
        <th>Risk Level</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const LAT = 45.816, LON = -84.727; 
    const pointsUrl = `https://api.weather.gov/points/${LAT},${LON}`;

    function getValueAtTime(valuesArray, targetDate) {
      if (!valuesArray || valuesArray.length === 0) return null;
      for (let i = 0; i < valuesArray.length; i++) {
        const parts = valuesArray[i].validTime.split("/");
        const startTime = new Date(parts[0]);
        let hours = 1;
        const match = parts[1].match(/PT(\d+)H/);
        const dayMatch = parts[1].match(/P(\d+)D/);
        if (match) hours = parseInt(match[1]);
        else if (dayMatch) hours = parseInt(dayMatch[1]) * 24;
        const endTime = new Date(startTime.getTime() + (hours * 60 * 60 * 1000));
        if (targetDate >= startTime && targetDate < endTime) return valuesArray[i].value;
      }
      return valuesArray[0].value; 
    }

    async function fetchUnifiedWeather() {
      try {
        const pointsRes = await fetch(pointsUrl);
        const pointsData = await pointsRes.json();
        const gridRes = await fetch(pointsData.properties.forecastGridData);
        const gridData = await gridRes.json();

        const tempRaw = gridData.properties.temperature.values;
        const windRaw = gridData.properties.windSpeed.values;
        const gustRaw = gridData.properties.windGust.values;
        const skyCoverRaw = gridData.properties.skyCover.values;

        const tableBody = document.getElementById('tableBody');
        
        let now = new Date();
        now.setMinutes(0, 0, 0);

        // Generates 48 hours of forecast in 3-hour steps to cleanly fill the taller vertical view
        for (let i = 0; i < 48; i += 3) {
          const targetTime = new Date(now.getTime() + (i * 60 * 60 * 1000));
          
          const tempC = getValueAtTime(tempRaw, targetTime);
          const windKph = getValueAtTime(windRaw, targetTime);
          const gustKph = getValueAtTime(gustRaw, targetTime);
          const skyCoverPct = getValueAtTime(skyCoverRaw, targetTime);

          const tempF = Math.round((tempC * 9/5) + 32);
          const windMph = Math.round(windKph * 0.621371);
          const gustMph = gustKph !== null ? Math.round(gustKph * 0.621371) : 0;
          const clouds = skyCoverPct !== null ? Math.round(skyCoverPct) : 0;

          // MBA Operational Logic (Max Threat: Sustained vs Gust)
          let status = "NORMAL", windClass = "wind-normal";
          let maxWindThreat = Math.max(windMph, gustMph);
          
          if (maxWindThreat >= 65) { status = "FULL CLOSURE"; windClass = "wind-full-closure"; }
          else if (maxWindThreat >= 50) { status = "PARTIAL CLOSURE"; windClass = "wind-closure"; }
          else if (maxWindThreat >= 35) { status = "ESCORTS REQ."; windClass = "wind-escort"; }
          else if (maxWindThreat >= 20) { status = "WIND ADVISORY"; windClass = "wind-advisory"; }

          let gustText = gustMph > 0 ? `<br><small><i>Gusts: ${gustMph} mph</i></small>` : "";
          const timeString = targetTime.toLocaleTimeString('en-US', { hour: 'numeric', weekday: 'short', timeZone: 'America/Detroit' });

          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${timeString}</strong></td>
            <td>${tempF}&deg;F</td>
            <td>${clouds}%</td>
            <td><span class="${windClass}">${windMph} mph</span> ${gustText}</td>
            <td><strong><span class="${windClass}">${status}</span></strong></td>
          `;
          tableBody.appendChild(row);
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('weatherTable').style.display = 'table';
      } catch (error) {
        document.getElementById('loading').innerText = "Forecast data temporarily unavailable.";
        console.error(error);
      }
    }

    fetchUnifiedWeather();
  </script>
</body>
</html>
