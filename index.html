<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      background-color: #0b1320; 
      color: #e0e6ed; 
      font-family: 'Avenir Next', 'Segoe UI', sans-serif; 
      margin: 0; 
      padding: 10px; 
    }
    
    /* Horizontal Scroll Wrapper */
    .table-container {
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: center; 
    }

    th, td { 
      padding: 8px 12px; 
      border-bottom: 1px solid #1a2b4c; 
      border-right: 1px solid #1a2b4c; 
    }

    /* Freeze the first column (Parameter Labels) on horizontal scroll */
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      background-color: #1a2b4c;
      color: #ffffff;
      font-weight: bold;
      text-align: left;
      z-index: 10;
      border-right: 2px solid #2a4374;
    }

    /* MBA Operational Threshold Styling */
    .wind-normal { background-color: #2ea043; color: #fff; font-weight: bold; border-radius: 4px; padding: 3px 6px; display: inline-block; }
    .wind-advisory { background-color: #ffcc00; color: #000; font-weight: bold; border-radius: 4px; padding: 3px 6px; display: inline-block; }
    .wind-escort { background-color: #ff6600; color: #fff; font-weight: bold; border-radius: 4px; padding: 3px 6px; display: inline-block; }
    .wind-closure { background-color: #cc0000; color: #fff; font-weight: bold; border-radius: 4px; padding: 3px 6px; display: inline-block; }
    .wind-full-closure { background-color: #8b0000; color: #fff; font-weight: bold; border-radius: 4px; padding: 3px 6px; animation: blinker 1.5s linear infinite; display: inline-block; }
    @keyframes blinker { 50% { opacity: 0.5; } }
    
    #loading { font-style: italic; color: #8b949e; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>

  <div id="loading">Fetching live high-precision NWS grid data...</div>
  
  <div class="table-container">
    <table id="weatherTable" style="display:none;">
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    const LAT = 45.816, LON = -84.727; 
    const pointsUrl = `https://api.weather.gov/points/${LAT},${LON}`;

    function getValueAtTime(valuesArray, targetDate) {
      if (!valuesArray || valuesArray.length === 0) return null;
      for (let i = 0; i < valuesArray.length; i++) {
        const parts = valuesArray[i].validTime.split("/");
        const startTime = new Date(parts[0]);
        let hours = 1;
        const match = parts[1].match(/PT(\d+)H/);
        const dayMatch = parts[1].match(/P(\d+)D/);
        if (match) hours = parseInt(match[1]);
        else if (dayMatch) hours = parseInt(dayMatch[1]) * 24;
        const endTime = new Date(startTime.getTime() + (hours * 60 * 60 * 1000));
        if (targetDate >= startTime && targetDate < endTime) return valuesArray[i].value;
      }
      return valuesArray[0].value; 
    }

    async function fetchUnifiedWeather() {
      try {
        const pointsRes = await fetch(pointsUrl);
        const pointsData = await pointsRes.json();
        const gridRes = await fetch(pointsData.properties.forecastGridData);
        const gridData = await gridRes.json();

        // Extract parameters
        const tempRaw = gridData.properties.temperature.values;
        const windRaw = gridData.properties.windSpeed.values;
        const gustRaw = gridData.properties.windGust.values;
        const skyCoverRaw = gridData.properties.skyCover.values;
        const iceRaw = gridData.properties.iceAccumulation ? gridData.properties.iceAccumulation.values : [];

        let now = new Date();
        now.setMinutes(0, 0, 0);

        // 1. Gather data slices into an array
        const periods = [];
        for (let i = 0; i < 48; i += 3) {
          const targetTime = new Date(now.getTime() + (i * 60 * 60 * 1000));
          
          const tempC = getValueAtTime(tempRaw, targetTime);
          const windKph = getValueAtTime(windRaw, targetTime);
          const gustKph = getValueAtTime(gustRaw, targetTime);
          const skyCoverPct = getValueAtTime(skyCoverRaw, targetTime);
          const iceMm = getValueAtTime(iceRaw, targetTime);

          const tempF = Math.round((tempC * 9/5) + 32);
          const windMph = Math.round(windKph * 0.621371);
          const gustMph = gustKph !== null ? Math.round(gustKph * 0.621371) : 0;
          const clouds = skyCoverPct !== null ? Math.round(skyCoverPct) : 0;
          const iceInches = iceMm !== null ? (iceMm * 0.0393701).toFixed(2) : "0.00";

          // MBA Operational Logic
          let status = "NORMAL", windClass = "wind-normal";
          let maxWindThreat = Math.max(windMph, gustMph);
          
          if (maxWindThreat >= 65) { status = "FULL CLOSURE"; windClass = "wind-full-closure"; }
          else if (maxWindThreat >= 50) { status = "PARTIAL CLOSURE"; windClass = "wind-closure"; }
          else if (maxWindThreat >= 35) { status = "ESCORTS REQ."; windClass = "wind-escort"; }
          else if (maxWindThreat >= 20) { status = "ADVISORY"; windClass = "wind-advisory"; }

          const timeString = targetTime.toLocaleTimeString('en-US', { hour: 'numeric', weekday: 'short', timeZone: 'America/Detroit' });
          const displayGust = gustMph > 0 ? gustMph : "-";

          periods.push({
            time: timeString,
            temp: `${tempF}&deg;F`,
            clouds: `${clouds}%`,
            wind: windMph,
            gust: displayGust,
            ice: iceInches,
            status: status,
            windClass: windClass
          });
        }

        // 2. Build the Transposed Rows
        const rows = [
          { label: "Time", key: "time", isHeader: true },
          { label: "Temp", key: "temp" },
          { label: "Clouds", key: "clouds" },
          { label: "Wind (mph)", key: "wind", isWind: true },
          { label: "Gusts (mph)", key: "gust", isWind: true },
          { label: "Ice (in)", key: "ice" },
          { label: "Risk Level", key: "status", isStatus: true }
        ];

        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        rows.forEach(rowDef => {
          const tr = document.createElement('tr');
          
          // Row Header Label
          const labelTd = document.createElement(rowDef.isHeader ? 'th' : 'td');
          labelTd.innerHTML = rowDef.label;
          tr.appendChild(labelTd);

          // Columns for each 3-hour period
          periods.forEach(p => {
            const td = document.createElement(rowDef.isHeader ? 'th' : 'td');
            
            if (rowDef.isHeader) {
              td.innerHTML = `<strong>${p.time}</strong>`;
            } else if (rowDef.isWind) {
              td.innerHTML = `<span class="${p.windClass}">${p[rowDef.key]}</span>`;
            } else if (rowDef.isStatus) {
              td.innerHTML = `<span class="${p.windClass}">${p[rowDef.key]}</span>`;
            } else {
              td.innerHTML = p[rowDef.key];
            }
            
            tr.appendChild(td);
          });

          tableBody.appendChild(tr);
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('weatherTable').style.display = 'table';
      } catch (error) {
        document.getElementById('loading').innerText = "Forecast data temporarily unavailable.";
        console.error(error);
      }
    }

    fetchUnifiedWeather();
  </script>
</body>
</html>
